name: Mise à jour des props NBA

on:
  schedule:
    - cron: "*/15 * * * *"   # le script décide s'il dépense une requête (quota, match proche)
  push:                      # relance immédiate quand le code de collecte change
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer le dosage du quota et tout récupérer maintenant"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-odds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les props NBA
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_MONTHLY_LIMIT: ${{ vars.ODDSPAPI_MONTHLY_LIMIT || '250' }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: python scripts/fetch_nba.py

      - name: Publier si les cotes ont changé
        run: |
          git config user.name "coteradar-bot"
          git config user.email "coteradar-bot@users.noreply.github.com"
          git add docs/nba.json data/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Props NBA $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X ours -q || true
            git push
          fi
