<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoteRadar NBA</title>
<meta name="description" content="Comparateur de cotes props joueurs NBA : Unibet, Winamax, PMU, Betclic, bwin, PokerStars">
<meta name="theme-color" content="#090c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoteRadar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090c11; --panel: #10151d; --panel-2: #161d27; --panel-3: #1d2632; --line: #222c39;
    --text: #edf2f7; --muted: #8494a7; --faint: #4d5b6c;
    --accent: #c6f432; --accent-ink: #0b0f05; --up: #3ddc84; --down: #ff6b6b; --warn: #ffb547;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

  /* en-tête */
  header { position: sticky; top: 0; z-index: 20; background: rgba(9,12,17,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .logo .tag { font-family: 'Barlow Condensed'; font-size: 13px; background: var(--accent); color: var(--accent-ink); padding: 1px 7px; border-radius: 5px; letter-spacing: .06em; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px rgba(61,220,132,.18); }
  .dot-live.ko { background: var(--down); box-shadow: 0 0 0 3px rgba(255,107,107,.18); }
  .icon-btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 12.5px; }

  /* bandeau des matchs */
  .games { display: flex; gap: 10px; overflow-x: auto; padding: 14px 0 12px; scrollbar-width: none; }
  .games::-webkit-scrollbar { display: none; }
  .day { flex: none; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; padding: 0 2px; }
  .game { flex: none; width: 176px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; position: relative; overflow: hidden; }
  .game:hover { border-color: #33404f; }
  .game.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .game .time { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 6px; }
  .game .time b { color: var(--text); font-weight: 600; }
  .game .team { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 600; font-size: 13px; }
  .game .count { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .game .count b { color: var(--accent); }
  .badge { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-family: 'Barlow Condensed'; font-weight: 800; font-size: 11.5px; letter-spacing: .02em; color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }

  /* affiche du match */
  .hero { border-radius: 18px; overflow: hidden; position: relative; border: 1px solid var(--line); margin-top: 4px; }
  .hero-bg { position: absolute; inset: 0; opacity: .55; }
  .hero-in { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 22px 24px; background: linear-gradient(180deg, rgba(9,12,17,.15), rgba(9,12,17,.75)); }
  .side { display: flex; align-items: center; gap: 14px; }
  .side.right { flex-direction: row-reverse; text-align: right; }
  .side .badge { width: 58px; height: 58px; border-radius: 16px; font-size: 22px; }
  .side .city { font-size: 12px; color: rgba(255,255,255,.75); text-transform: uppercase; letter-spacing: .08em; }
  .side .nick { font-family: 'Barlow Condensed'; font-size: 30px; font-weight: 800; line-height: 1; text-transform: uppercase; }
  .vs { text-align: center; }
  .vs .t { font-family: 'Barlow Condensed'; font-size: 26px; font-weight: 800; }
  .vs .d { font-size: 12px; color: rgba(255,255,255,.75); }
  .hero-meta { position: relative; display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 24px; background: rgba(9,12,17,.7); font-size: 12.5px; color: var(--muted); border-top: 1px solid rgba(255,255,255,.06); }
  .hero-meta b { color: var(--text); }

  /* commandes */
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 16px 0 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 700; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .tab .n { font-size: 11px; background: var(--panel-3); color: var(--muted); border-radius: 6px; padding: 1px 6px; }
  .tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab.on .n { background: rgba(0,0,0,.12); color: var(--bg); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; padding: 6px 10px; border-radius: 7px; font-weight: 700; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .seg button.on { background: var(--panel-3); color: var(--text); }
  .seg .badge { width: 18px; height: 18px; border-radius: 5px; font-size: 8.5px; }
  .search { flex: 1; min-width: 170px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; outline: none; }
  .search:focus { border-color: var(--muted); }
  .books { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .book { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 5px; font-size: 12.5px; font-weight: 600; }
  .book.off { opacity: .35; }
  .book.na { opacity: .25; cursor: default; }
  .bk { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; flex: none; }

  /* lignes joueurs */
  .players { display: flex; flex-direction: column; gap: 8px; padding-bottom: 32px; }
  .prow { display: grid; grid-template-columns: 210px 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .pid { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-right: 1px solid var(--line); background: linear-gradient(90deg, var(--tc, transparent) -260%, transparent 70%); min-width: 0; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: 'Barlow Condensed'; font-weight: 800; font-size: 15px; color: #fff; background: var(--tc, var(--panel-3)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.15); }
  .pname { font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
  .pteam { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .cuts { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .cut { flex: none; min-width: 112px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 7px 8px 6px; position: relative; }
  .cut-h { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin: 0 2px 5px; }
  .cut-h .v { font-size: 22px; line-height: 1; }
  .cut-h .v small { font-size: 13px; color: var(--muted); margin-left: 1px; }
  .edge { font-size: 10.5px; font-weight: 800; color: var(--accent-ink); background: var(--accent); border-radius: 5px; padding: 1px 5px; }
  .line { display: flex; align-items: center; gap: 6px; padding: 3px 5px; border-radius: 7px; font-size: 12.5px; }
  .line .bn { color: var(--muted); font-size: 11.5px; flex: 1; white-space: nowrap; }
  .line .o { font-size: 16px; }
  .line.best { background: var(--accent); color: var(--accent-ink); }
  .line.best .bn { color: rgba(11,15,5,.7); font-weight: 600; }
  .arr { font-size: 8px; margin-left: 2px; }
  .arr.up { color: var(--up); } .arr.down { color: var(--down); }
  .line.best .arr { color: var(--accent-ink); }
  .solo .line.best { background: var(--panel-3); color: var(--text); }
  .solo .line.best .bn { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 56px 20px; background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); margin: 16px 0 40px; }
  .empty .big { font-size: 40px; margin-bottom: 8px; }
  .empty a { color: var(--accent); }
  .demo-flag { background: rgba(255,181,71,.1); border: 1px solid rgba(255,181,71,.35); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-top: 12px; }
  .demo-flag a { color: var(--accent); }
  footer { color: var(--faint); font-size: 11.5px; padding: 8px 0 28px; }

  @media (max-width: 760px) {
    .prow { grid-template-columns: 1fr; }
    .pid { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; }
    .hero-in { padding: 16px; gap: 8px; }
    .side .badge { width: 44px; height: 44px; font-size: 16px; border-radius: 12px; }
    .side .nick { font-size: 21px; }
    .side .city { font-size: 10.5px; }
    .vs .t { font-size: 20px; }
    .hero-meta { padding: 8px 16px; gap: 12px; }
    .status .txt { display: none; }
  }

  /* sélection du joueur */
  .controls { margin-top: 14px; }
  .controls .books { margin: 0; }
  .picker { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 14px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .pchip { flex: none; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 5px; font-weight: 600; white-space: nowrap; }
  .pchip:hover { border-color: #33404f; }
  .pchip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .pc-ref { font-size: 13px; color: var(--muted); }
  .pchip.on .pc-ref { color: var(--accent); }
  .avatar.sm { width: 28px; height: 28px; font-size: 11px; }
  .avatar.lg { width: 56px; height: 56px; font-size: 20px; }
  .small { font-size: 12px; color: var(--muted); }

  /* fiche joueur */
  .player { padding-bottom: 32px; scroll-margin-top: 70px; }
  .ph { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: linear-gradient(90deg, var(--tc, var(--panel-2)) -200%, var(--panel) 75%); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
  .ph-name { font-family: 'Barlow Condensed'; font-size: 28px; font-weight: 800; line-height: 1.05; text-transform: uppercase; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; scroll-margin-top: 72px; }
  .stat-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .stat-h h3 { margin: 0; font-family: 'Barlow Condensed'; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 12px 0 2px; }
  .stat .cuts { padding: 6px 0 2px; }
  .ouline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .ou-side { background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ou-lab { min-width: 58px; font-size: 20px; }
  .ou-books { display: flex; gap: 6px; flex-wrap: wrap; }
  .ou { display: inline-flex; align-items: center; gap: 5px; background: var(--panel-3); border-radius: 7px; padding: 3px 7px 3px 4px; font-size: 15px; }
  .ou.best { background: var(--accent); color: var(--accent-ink); }
  .more summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin: 4px 0 8px; }
  @media (max-width: 760px) {
    .ouline { grid-template-columns: 1fr; }
    .ph-name { font-size: 22px; }
  }

  /* vue tableau */
  .view-seg button { padding: 6px 12px; }
  .tbl-wrap { overflow: auto; max-height: calc(100vh - 140px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  .tbl { border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: 100%; }
  .tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; }
  .tbl td { vertical-align: top; }  /* moyennes des 5 derniers alignées sur toute la ligne */
  .tbl thead th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding: 8px 8px; text-align: left; }
  .tbl .tbl-name { position: sticky; left: 0; z-index: 1; background: var(--panel); border-right: 1px solid var(--line); text-align: left; }
  .tbl thead .tbl-name { z-index: 3; background: var(--panel-2); }
  .tbl tbody tr:hover td, .tbl tbody tr:hover .tbl-name { background: var(--panel-2); }
  .tbl-player { display: flex; align-items: center; gap: 8px; background: linear-gradient(90deg, var(--tc, transparent) -300%, transparent 80%); border: 0; padding: 24px 12px; font-weight: 700; font-size: 13.5px; width: 100%; text-align: left; }
  .avatar.xs { width: 26px; height: 26px; font-size: 10px; }
  .tc { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; background: none; border: 0; padding: 14px 12px 16px; width: 100%; font-size: 12px; }
  .tc-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; align-self: stretch; }
  .tc-head-l { display: flex; align-items: center; gap: 6px; }
  .tc-l5 { display: inline-flex; align-items: baseline; gap: 4px; font-size: 11px; color: var(--muted); background: var(--panel-3); border-radius: 6px; padding: 2px 8px; }
  .tc-l5 b { font-size: 17px; color: var(--text); }
  .tc-l5.above { background: rgba(61,220,132,.12); color: var(--up); } .tc-l5.above b { color: var(--up); }
  .tc-l5.below { background: rgba(255,107,107,.12); color: var(--down); } .tc-l5.below b { color: var(--down); }
  .tc-l5v { display: inline-flex; gap: 8px; font-size: 17px; font-weight: 700; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
  .tc-l5v i { font-style: normal; color: var(--muted); }
  .tc-l5v i.above { color: var(--up); } .tc-l5v i.below { color: var(--down); } .tc-l5v i.prev { opacity: .4; }
  .tc-multi { font-size: 10px; font-weight: 800; color: var(--warn); background: rgba(255,181,71,.14); border-radius: 5px; padding: 2px 6px; }
  .tc-blocks { display: flex; flex-direction: column; gap: 8px; }
  .tc-block { display: flex; align-items: center; gap: 10px; }
  .tc-blocks.multi .tc-block + .tc-block { border-top: 1px dashed #33404f; padding-top: 8px; }
  .tc:hover { background: var(--panel-3); }
  .tc-line { font-family: 'Barlow Condensed'; font-weight: 800; font-size: 17px; min-width: 40px; text-align: center; color: var(--accent); background: rgba(198,244,50,.1); border: 1px solid rgba(198,244,50,.3); border-radius: 6px; padding: 1px 6px; }
  .tc-odd { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 10px; }
  .tc-odd b { color: var(--text); font-size: 14px; font-weight: 500; }
  .tc-odd .bk { width: 14px; height: 14px; font-size: 7.5px; }
  .tc-odd.na { opacity: .4; }
  .tc-empty { color: var(--faint); text-align: center; }
  .tc-rows { display: flex; flex-direction: column; gap: 6px; }
  .tc-row { display: flex; align-items: center; gap: 4px; }
  .tc-sign { font-style: normal; font-size: 9px; width: 10px; }
  .tc-sign.up { color: var(--up); } .tc-sign.down { color: var(--down); }
  .tc-chip { display: inline-flex; align-items: center; gap: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 5px 2px 3px; }
  .tc-chip b { font-size: 13px; font-weight: 500; color: var(--text); }
  .tc-chip .bk { width: 14px; height: 14px; font-size: 7.5px; }
  .tc-chip.best { background: var(--accent); border-color: var(--accent); }
  .tc-chip.best b { color: var(--accent-ink); font-weight: 700; }
  .tc-none { color: var(--faint); font-size: 12px; }
  .tbl td, .tbl thead th:not(.tbl-name) { border-left: 1px solid #2c3847; }  /* séparation entre catégories */
  .tbl-legend { margin: 8px 2px 28px; }
  .nm-short { display: none; }
  @media (max-width: 760px) {
    .tbl-wrap { max-height: none; }
    .nm-full, .tbl-player .avatar { display: none; }
    .nm-short { display: inline; }
    .tbl-player { padding: 18px 7px; font-size: 12px; max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
    .tc { padding: 12px 6px 14px; gap: 6px; }
    .tc-block { gap: 6px; }
    .tc-head { gap: 10px; }
    .tc-l5 b, .tc-l5v { font-size: 15px; }
    .tc-l5v { gap: 6px; padding: 1px 6px; }
    .tc-chip b { font-size: 12px; }
    .tc-line { font-size: 15px; min-width: 32px; padding: 1px 4px; }
    .tc-odd b { font-size: 12px; }
  }

  /* compositions */
  .lu { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 12px; }
  .lu-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .lu-head h3 { margin: 0; font-family: 'Barlow Condensed'; font-size: 20px; font-weight: 800; text-transform: uppercase; }
  .lu-head a { color: var(--muted); }
  .lu-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lu-team { background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
  .lu-th { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .lu-nick { font-weight: 800; }
  .lu-status { margin-left: auto; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; }
  .lu-status.expected { background: rgba(255,181,71,.14); color: var(--warn); }
  .lu-status.confirmed { background: rgba(61,220,132,.14); color: var(--up); }
  .lu-list { list-style: none; margin: 0; padding: 0; }
  .lu-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .lu-list li:first-child { border-top: 0; }
  .lu-pos { width: 24px; font-size: 11px; font-weight: 700; color: var(--muted); }
  .lu-name { background: none; border: 0; padding: 0; font-weight: 600; text-align: left; }
  button.lu-name:hover { color: var(--accent); text-decoration: underline; }
  span.lu-name { color: var(--muted); }
  .lu-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--up); }
  .lu-dot.p75 { background: #9be15d; } .lu-dot.p50 { background: var(--warn); } .lu-dot.p25 { background: #ff8a4c; } .lu-dot.p0 { background: var(--down); }
  .lu-ofs { margin-top: 6px; }
  .lu-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .lu-foot b { color: var(--text); font-weight: 700; margin-right: 4px; }
  .inj { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 5px; padding: 1px 6px; margin-left: 4px; }
  .inj.sm { font-size: 10px; padding: 0 5px; }
  .inj-out { background: rgba(255,107,107,.18); color: var(--down); }
  .inj-doubt { background: rgba(255,138,76,.18); color: #ff8a4c; }
  .inj-ques { background: rgba(255,181,71,.18); color: var(--warn); }
  .inj-prob { background: rgba(61,220,132,.16); color: var(--up); }
  .pc-pos { font-size: 10px; font-weight: 800; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  @media (max-width: 760px) { .lu-teams { grid-template-columns: 1fr; } }

  /* 5 derniers matchs */
